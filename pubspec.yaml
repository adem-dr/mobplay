name: mobplay
description: A futuristic audio streaming app with Firebase integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.2
  
  provider: ^6.1.2
  
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  rxdart: ^0.28.0
  
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  shared_preferences: ^2.3.3
  
  intl: ^0.19.0
  
  lottie: ^3.1.3
  http: ^1.2.1
  audioplayers: ^6.0.0
  local_auth: ^2.2.0
  local_auth_android: ^1.0.40
  fl_chart: ^0.68.0
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  flutter_compass: ^0.8.1
  geolocator: ^13.0.2
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
